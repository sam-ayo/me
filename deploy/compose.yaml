# Runs the site on the Oracle Cloud VM. deploy.sh copies this file to /opt/me
# and sets IMAGE_TAG in /opt/me/.env. The Redis tokens are in /opt/me/app.env.
services:
  web:
    image: me:${IMAGE_TAG:?Set IMAGE_TAG in /opt/me/.env}
    restart: unless-stopped
    # Node as PID 1 does not stop on SIGTERM. The init process passes the signal.
    init: true
    env_file: app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    networks:
      # Caddy of the mail app is the HTTPS proxy. It reaches this site as me:3000.
      mail_default:
        aliases: [me]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

networks:
  mail_default:
    external: true
